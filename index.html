<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commercial Readiness Weekly Status Report</title>
<link rel="stylesheet" href="assets/brand.css">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <img src="assets/logo-graphite.svg" alt="Elsevier">
    <nav><a href="update.html">Submit your update</a></nav>
  </div>

  <h1 class="title">Commercial Readiness Weekly Status Report</h1>
  <p class="subtitle" id="weekOfLine">Loading&hellip;</p>
  <hr class="hr-orange">

  <div id="report"></div>

  <div class="section-band">Upcoming Out of Office</div>
  <table id="oooTable">
    <thead><tr><th>Team member</th><th>Planned OOO</th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="section-band">Sign Off</div>
  <table id="signOffTable">
    <thead><tr><th>Team member</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <footer class="page-footer">
    <span>Commercial Readiness &mdash; Weekly Status Report</span>
    <span id="generatedAt"></span>
  </footer>
</div>

<script src="assets/projects.js"></script>
<script>
(function(){
  function fileNameFor(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "") + ".json";
  }

  function fetchEmployee(name){
    return fetch("data/" + fileNameFor(name) + "?t=" + Date.now())
      .then(function(r){ if (!r.ok) throw new Error("missing"); return r.json(); })
      .then(function(data){ return { name: name, data: data, found: true }; })
      .catch(function(){ return { name: name, data: null, found: false }; });
  }

  Promise.all(EMPLOYEES.map(fetchEmployee)).then(function(results){
    renderReport(results);
  });

  function renderReport(results){
    const found = results.filter(function(r){ return r.found; });

    // "Week of" line — most recent weekOf across submitted files, else today
    let weekOf = null;
    found.forEach(function(r){
      if (r.data.weekOf && (!weekOf || r.data.weekOf > weekOf)) weekOf = r.data.weekOf;
    });
    const weekOfDate = weekOf ? new Date(weekOf + "T00:00:00") : new Date();
    document.getElementById("weekOfLine").textContent =
      "Week of " + weekOfDate.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

    // ---- Project sections ----
    const reportEl = document.getElementById("report");
    reportEl.innerHTML = "";

    GROUPS.forEach(function(group){
      const band = document.createElement("div");
      band.className = "section-band";
      band.textContent = group.title;
      reportEl.appendChild(band);

      group.items.forEach(function(item){
        const sentences = [];
        found.forEach(function(r){
          const text = r.data.updates && r.data.updates[item.id];
          if (text && text.trim()) sentences.push(text.trim());
        });

        const itemEl = document.createElement("div");
        itemEl.className = "item";
        const combined = sentences.join(" ");
        itemEl.innerHTML =
          "<h3>" + item.name + "</h3>" +
          (combined
            ? "<p class=\"body\">" + escapeHtml(combined) + "</p>"
            : "<p class=\"empty\">No updates yet.</p>");
        reportEl.appendChild(itemEl);
      });
    });

    // ---- Out of Office ----
    const oooBody = document.querySelector("#oooTable tbody");
    oooBody.innerHTML = "";
    EMPLOYEES.forEach(function(name){
      const r = results.find(function(x){ return x.name === name; });
      const ooo = (r && r.found && r.data.ooo) ? r.data.ooo : "None";
      const tr = document.createElement("tr");
      tr.innerHTML = "<td><strong>" + name + "</strong></td><td>" + escapeHtml(ooo) + "</td>";
      oooBody.appendChild(tr);
    });

    // ---- Sign Off ----
    const signBody = document.querySelector("#signOffTable tbody");
    signBody.innerHTML = "";
    EMPLOYEES.forEach(function(name){
      const r = results.find(function(x){ return x.name === name; });
      const signed = !!(r && r.found && r.data.signedOff);
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td><strong>" + name + "</strong></td>" +
        "<td class=\"" + (signed ? "status-signed" : "status-pending") + "\">" +
        (signed ? "Signed" : "Not yet signed") + "</td>";
      signBody.appendChild(tr);
    });

    document.getElementById("generatedAt").textContent =
      "Generated " + new Date().toLocaleString("en-US");
  }

  function escapeHtml(s){
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
})();
</script>
</body>
</html>
